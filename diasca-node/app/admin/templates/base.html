<!DOCTYPE html>
<html lang="en" data-theme="autumn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DIASCA Admin{% endblock %}</title>
    <!-- Tailwind and DaisyUI via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.10.2/dist/full.min.css" rel="stylesheet" type="text/css" />
    <!-- Suppress Tailwind CDN warning for clean console -->
    <script>
        const originalWarn = console.warn;
        console.warn = function() {
            if (arguments[0] && typeof arguments[0] === 'string' && arguments[0].includes('cdn.tailwindcss.com should not be used in production')) {
                return;
            }
            originalWarn.apply(console, arguments);
        };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-base-200 min-h-screen">
    <div class="navbar bg-base-100 shadow-sm px-8">
        <div class="flex-1">
            <a class="btn btn-ghost text-xl" href="/admin/platforms">DIASCA Central Node</a>
        </div>
        <div class="flex-none">
            <ul class="menu menu-horizontal px-1">
                <li><a href="/admin/platforms">Platforms</a></li>
                <li><a href="/admin/scopes">Scopes</a></li>
                <li><a href="/docs" target="_blank">API Docs</a></li>
            </ul>
        </div>
    </div>

    <main class="container mx-auto p-8">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
